<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Sign In — Swan Turbines Foundation</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../logo.png">
</head>
<body class="admin-login-page">
    <div class="loader" id="loader"><div class="loader-logo"><img src="../logo.png" alt="Swan Turbines Foundation" width="48" height="48">Swan Turbines Foundation</div></div>
    <main class="app-container" style="max-width:440px;padding-top:150px;min-height:calc(100vh - 100px);">
        <div class="auth-card" style="margin:0 auto;">
            <div class="auth-header"><h2>Administrator sign in</h2><p>This area is for authorised foundation staff only.</p></div>
            <div class="auth-error-banner" id="adminAuthError"></div>
            <form class="auth-form" onsubmit="handleAdminLogin(event)">
                <div class="auth-field"><label for="adm_email">Administrator email</label><div class="auth-input-wrapper"><input type="email" id="adm_email" required autocomplete="username" placeholder="name@foundation.org"></div></div>
                <div class="auth-field"><label for="adm_pass">Password</label><div class="auth-input-wrapper"><input type="password" id="adm_pass" required autocomplete="current-password" placeholder="••••••••"><button type="button" class="toggle-password" onclick="SwanAuth.togglePass('adm_pass', this)">Show</button></div></div>
                <button type="submit" class="auth-submit-btn" style="background:#051d38;">Sign in to admin portal</button>
            </form>
        </div>
    </main>
    <script src="../js/db.js"></script><script src="../js/auth.js"></script><script src="../js/main.js"></script>
    <script>
        async function handleAdminLogin(event) {
            event.preventDefault();
            const error = document.getElementById('adminAuthError');
            error.classList.remove('show');
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const user = await SwanAuth.login(
                    document.getElementById('adm_email').value,
                    document.getElementById('adm_pass').value,
                    true
                );
                if (user.role !== 'admin' && (!user.role_ids || !user.role_ids.length)) {
                    throw new Error('Access denied: this account does not have administrator permissions.');
                }
                window.location.href = '../admin.html';
            } catch (err) {
                error.textContent = err.message || 'Invalid administrator credentials.';
                error.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        }
        document.addEventListener('DOMContentLoaded', () => { if (SwanAuth.isAdmin()) window.location.href = '../admin.html'; });
    </script>
</body>
</html>
