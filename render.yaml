services:
  - type: web
    name: swan-foundation-api
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: swan_turbines_foundation
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 480
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Swan Turbines Foundation <notifications@swanturbinesfoundation.com>
      - key: ALLOWED_ORIGINS
        value: https://swanturbinesfoundation.com,https://admin.swanturbinesfoundation.com,https://manage.swanturbinesfoundation.com,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500
