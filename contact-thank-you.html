<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Message received | Swan Turbines Foundation</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root{--ink:#062b52;--line:#dce7f0;--muted:#506780}*{box-sizing:border-box}body{margin:0;background:#f3f8fc;color:var(--ink);font:16px/1.55 Arial,sans-serif}.nav{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,7vw)}.brand{display:flex;align-items:center;gap:11px;font-weight:800;text-decoration:none;color:var(--ink)}.brand img{width:42px;height:42px}.nav a:not(.brand){color:var(--ink);text-decoration:none;font-weight:700}.wrap{min-height:calc(100vh - 74px);display:grid;place-items:center;padding:42px 20px}.card{width:min(610px,100%);padding:48px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px #0b41611a;text-align:center}.tick{width:72px;height:72px;display:grid;place-items:center;border-radius:50%;margin:0 auto 18px;background:#e9fbf3;color:#07875d;font-size:40px;font-weight:700}h1{margin:0 0 10px;font-size:30px;line-height:1.18}p{color:var(--muted);margin:0 auto 22px;max-width:480px}.confirmation{padding:12px 15px;background:#f3fbff;border:1px solid #cdeafa;border-radius:10px;font-size:13px;color:#28628c;margin:24px auto}.button{display:inline-block;border-radius:9px;padding:11px 17px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700}@media(max-width:520px){.nav{padding:0 18px}.nav a:not(.brand){display:none}.card{padding:34px 22px}}
  </style>
</head>
<body>
  <header class="nav"><a class="brand" href="index.html"><img src="logo.png" alt="Swan Turbines Foundation">Swan Turbines Foundation</a><a href="contact.html">Contact</a></header>
  <main class="wrap"><section class="card" aria-labelledby="title"><div class="tick" aria-hidden="true">✓</div><h1 id="title">Message received</h1><p>Thank you for contacting Swan Turbines Foundation. Your message has been securely recorded and our team will get back to you shortly.</p><div class="confirmation" id="confirmation">Submission confirmed.</div><a class="button" href="index.html">Return home</a></section></main>
  <script>const id=new URLSearchParams(location.search).get('submission');if(id)document.getElementById('confirmation').textContent='Submission confirmed. Reference: '+id;</script>
</body>
</html>
