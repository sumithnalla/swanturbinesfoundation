<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="description" content="Admin panel for reviewing and managing all help requests.">

<body data-contact-view="list">
<div class="adm-shell">

        <div class="adm-sidebar-logo">
            <img src="logo.png" alt="Swan Turbines Foundation">

                <span class="brand-sub">Foundation Admin</span>
            </div>
        </div>
        <nav class="adm-sidebar-nav">
            <span class="adm-nav-label">Navigation</span>
            <a class="adm-nav-item" href="admin.html">

                <span class="nav-text">Campaigns</span>
            </a>
            <a class="adm-nav-item" href="admin-requests.html">

                <span class="adm-nav-badge" id="sidebarRequestsBadge">0</span>
            </a>
            <a class="adm-nav-item active" href="admin-contacts.html"><span class="nav-text">Contact Messages</span></a>
            <span class="adm-nav-label">Settings</span>
            <a class="adm-nav-item" href="admin-profile.html">

                <span class="nav-text">Admin Profile</span>
            </a>
            <a class="adm-nav-item" href="index.html" target="_blank">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>

                    <div class="user-role">System Administrator</div>
                </div>
            </div>
        </div>

        <header class="adm-topbar">
            <div class="adm-topbar-title"><span>Contact Messages</span></div>
            <div class="adm-topbar-actions"><button class="btn-secondary" onclick="SwanAuth.logout()">Logout</button></div></header>
        <main class="adm-content"><section id="contactMessagesContent" aria-live="polite"><div class="adm-empty"><div class="adm-loader-spinner"></div><h3>Loading contact messages…</h3></div></section></main>

<script src="js/db.js"></script>
