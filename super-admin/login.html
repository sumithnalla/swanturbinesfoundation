<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050b18;font-family:Arial,sans-serif;color:#fff}.card{width:min(430px,calc(100% - 32px));background:#0d1a31;border:1px solid #29466c;border-radius:16px;padding:32px}.field{margin:18px 0}.field label{display:block;margin-bottom:7px}.field input{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;border:1px solid #426189;background:#071225;color:#fff}.btn{width:100%;padding:14px;border:0;border-radius:8px;background:#4d6cf5;color:#fff;font-weight:700}.error{display:none;background:#5b1d27;padding:10px;border-radius:8px}</style></head><body><main class="card"><h1>Super Admin Login</h1><p>WEBSITTER infrastructure access</p><div id="error" class="error"></div><form id="login"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn">Authorize Super Admin</button></form></main><script>(function(){const api='https://qlfdbimnswbaiouvmtau.supabase.co/functions/v1/api',form=document.getElementById('login'),err=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';try{const r=await fetch(api+'/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:email.value.trim().toLowerCase(),password:password.value})}),b=await r.json();if(!r.ok)throw Error(b.error?.message||'Invalid email or password.');if(!b.user?.role_names?.includes('super_admin'))throw Error('This account does not have Super Admin access.');localStorage.setItem('swan_admin_token',b.access_token);location.href='../manage/index.html'}catch(x){err.textContent=x.message;err.style.display='block'}})})()</script></body></html>
